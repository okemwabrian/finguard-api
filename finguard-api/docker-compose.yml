services:
  postgres:
    image: postgres:16-alpine
    container_name: finguard_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - finguard_pgdata:/var/lib/postgresql/data

volumes:
  finguard_pgdata:
